name: Flutter and Android quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android runner for CI build
        shell: bash
        run: |
          if [ -d android ] && [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            mkdir -p "$RUNNER_TEMP/campus-android-docs"
            cp -a android/. "$RUNNER_TEMP/campus-android-docs/"
            rm -rf android
            flutter create --platforms=android --org com.byusa .
            cp -a "$RUNNER_TEMP/campus-android-docs/." android/
          else
            flutter create --platforms=android --org com.byusa .
          fi

      - name: Validate Windows setup scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem tooling -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell syntax validation failed: $($file.Name)"
            }
          }

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: |
          dart format lib test integration_test
          dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-incident-reporter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Flutter coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  firebase-rules:
    name: Firebase Firestore and Storage rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Firebase rule-test JavaScript syntax
        run: node --check firebase/rules-tests/test/security_rules.test.cjs

      - name: Validate Firebase configuration JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firebase.json')); JSON.parse(require('fs').readFileSync('firebase/rules-tests/package.json'));"

      - name: Install rule-test dependencies
        working-directory: firebase/rules-tests
        run: npm install --no-audit --no-fund

      - name: Run Firebase Emulator security tests
        run: |
          npx --yes firebase-tools emulators:exec \
            --project demo-campus-incident-reporter \
            --only firestore,storage \
            "npm --prefix firebase/rules-tests test"
